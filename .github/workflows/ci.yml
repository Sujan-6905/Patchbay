name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-typecheck-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test

  e2e:
    runs-on: ubuntu-latest
    needs: lint-typecheck-test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build -w shared
      - run: npx playwright install --with-deps chromium
      # Screen-share tests drive a real getDisplayMedia() capture, which needs an actual
      # display to draw into (headless Chromium has none); xvfb-run provides a virtual one,
      # matching e2e/playwright.config.ts running this project in headed mode.
      - run: xvfb-run -a npm run test:e2e
        env:
          CI: true

  docker-build:
    runs-on: ubuntu-latest
    needs: lint-typecheck-test
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t patchbay:ci .
